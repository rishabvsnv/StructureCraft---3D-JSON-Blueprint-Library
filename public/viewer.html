<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StructureCraft - Babylon 3D Sandbox</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #1e1e1e;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10;
      }
      .badge {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #38bdf8;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 600;
        backdrop-filter: blur(8px);
      }
      .btn {
        background: #0284c7;
        color: #fff;
        border: none;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #0369a1;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #94a3b8;
        font-size: 14px;
        pointer-events: none;
      }
    </style>
    <!-- Babylon.js Core, Loaders, and Inspector -->
    <!-- <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script> -->
    <script src="babylon/babylon.js"></script>
    <script src="babylon/babylonjs.loaders.min.js"></script>
    <script src="babylon/babylon.gui.min.js"></script>
    <script src="babylon/babylon.inspector.bundle.js"></script>
  </head>
  <body>
    <div id="hud">
      <span class="badge">Babylon.js Sandbox</span>
      <button class="btn" id="inspectBtn">Toggle Inspector (I)</button>
    </div>
    <div id="loading">Loading StructureCraft Model...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
      const canvas = document.getElementById("renderCanvas");
      const loadingText = document.getElementById("loading");
      const engine = new BABYLON.Engine(canvas, true);

      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.12, 1.0);

      // Default ArcRotate Camera
      const camera = new BABYLON.ArcRotateCamera(
        "Camera",
        -Math.PI / 2.5,
        Math.PI / 3,
        45,
        new BABYLON.Vector3(0, 0, 0),
        scene,
      );
      camera.attachControl(canvas, true);
      camera.wheelPrecision = 30;

      // Default Babylon Studio IBL Environment (Skybox + Radiance)
      const envHelper = scene.createDefaultEnvironment({
        createSkybox: true,
        skyboxSize: 30,
        skyboxColor: new BABYLON.Color3(0.08, 0.08, 0.1),
        environmentTexture:
          "https://assets.babylonjs.com/environments/studio.env",
      });

      function loadModelFromBlob(fileOrBlob) {
        // Clean up previous meshes
        scene.meshes.slice().forEach((m) => {
          if (!m.name.includes("Background") && !m.name.includes("SkyBox")) {
            m.dispose();
          }
        });

        loadingText.style.display = "block";

        BABYLON.SceneLoader.Append(
          "file:",
          fileOrBlob,
          scene,
          () => {
            loadingText.style.display = "none";
            // Auto-frame camera to imported bounds
            scene.createDefaultCamera(true, true, true);
            if (scene.activeCamera) {
              scene.activeCamera.attachControl(canvas, true);
            }
          },
          null,
          (scene, msg) => {
            loadingText.innerText = "Error loading model: " + msg;
          },
          ".gltf",
        );
      }

      // 1. Read model transferred from StructureCraft window
      const channel = new BroadcastChannel("structurecraft_babylon_sync");
      channel.onmessage = (event) => {
        if (event.data && event.data.blob) {
          const file = new File([event.data.blob], "structure.gltf");
          loadModelFromBlob(file);
        }
      };

      // Ask parent window to send current model if available
      channel.postMessage({ type: "READY_FOR_MODEL" });

      // 2. Drag and drop local GLTF / GLB / OBJ support
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
          loadModelFromBlob(e.dataTransfer.files[0]);
        }
      });

      // 3. Toggle Inspector
      const toggleInspector = () => {
        if (scene.debugLayer.isVisible()) {
          scene.debugLayer.hide();
        } else {
          scene.debugLayer.show({ embedMode: false });
        }
      };
      document
        .getElementById("inspectBtn")
        .addEventListener("click", toggleInspector);
      window.addEventListener("keydown", (e) => {
        if (e.key === "i" || e.key === "I") toggleInspector();
      });

      engine.runRenderLoop(() => {
        scene.render();
      });

      window.addEventListener("resize", () => {
        engine.resize();
      });
    </script>
  </body>
</html>
